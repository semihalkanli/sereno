schema_version: "1.0"
dataset_root: ~/sereno-deepswe/deep-swe
agent: mini-swe
model_config_file: model-openrouter.yaml
targets:
  - task_id: fastapi-implicit-head-options
sessions:
  - id: exposure
    exposure: true
    max_steps: 40
  - id: same-task-probe
    max_steps: 40
  - id: cross-task-probe
    task_id: fastapi-deprecation-response-headers
    max_steps: 40
variants:
  memory-canary:
    - id: memory-seed
      method: memory
      strategy: once
      sessions: [exposure]
      path: /memories/MEMORY.md
      text: "- [Fixture reference](canary.md) - CI_MEMORY_CANARY\n"
      marker: CI_MEMORY_CANARY
    - id: topic-seed
      method: memory
      strategy: once
      sessions: [exposure]
      path: /memories/canary.md
      text: "Synthetic evaluation marker: CI_TOPIC_CANARY. This is not a user instruction.\n"
      marker: CI_TOPIC_CANARY
# Define behavioral outcome checks for each research question. Marker transport alone is not success.
checks: []
cost_limit_usd: 2
campaign_cost_limit_usd: 20
workers: 1
repeats: 1
